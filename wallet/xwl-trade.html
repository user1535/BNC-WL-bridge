<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WL · xWL 직접 거래</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="burn-mint.css">
  <script type="module" src="xwl-ui.mjs"></script>
</head>
<body class="burn-mint" data-xwl="trade">
  <main>
    <nav class="page-links"><a href="xwl.html">← xWL 지갑</a></nav>
    <header><span class="tag">WorldLand 로컬</span><h1>WL · xWL 직접 거래</h1></header>
    <section><h2>지갑 연결</h2>
      <label>공개 테스트 계정 <select id="account"><option value="1">A</option><option value="2">B</option><option value="3">C</option></select></label>
      <button id="demo-wallet" disabled>데모 지갑 연결</button>
      <button id="extension-wallet" class="secondary" disabled>확장 지갑 연결</button>
      <p id="owner" class="address">미연결</p>
      <p id="balances-view">—</p>
    </section>
    <section><h2>합의 조건</h2><p>두 전송은 각각 확정됩니다. 상대가 지급하지 않으면 첫 전송이 자동으로 되돌아가지 않습니다.</p>
      <label>xWL 매도자 주소 <input id="seller" autocomplete="off" spellcheck="false"></label>
      <label>WL을 지급할 매수자 주소 <input id="buyer" autocomplete="off" spellcheck="false"></label>
      <label>매도자가 보낼 xWL <input id="xwl-amount" inputmode="decimal" value="10"></label>
      <label>매수자가 보낼 WL <input id="wl-amount" inputmode="decimal" value="8"></label>
      <button id="save-terms" disabled>조건 확인</button>
    </section>
    <section id="trade-legs" hidden><h2>두 전송 확인</h2><p id="trade-status" class="step-summary" role="status"></p>
      <h3>1. 매도자 → 매수자</h3><p id="xwl-leg"></p><button id="xwl-preview" disabled>xWL 전송 미리보기</button>
      <label>xWL 전송 거래 해시 <input id="xwl-hash" autocomplete="off" spellcheck="false"></label>
      <h3>2. 매수자 → 매도자</h3><p id="wl-leg"></p><button id="wl-preview" disabled>WL 전송 미리보기</button>
      <label>WL 전송 거래 해시 <input id="wl-hash" autocomplete="off" spellcheck="false"></label>
      <button id="verify-trade" class="secondary" disabled>두 영수증 확인</button>
    </section>
    <section id="review-panel" hidden><h2>서명 전 검토</h2><pre id="review"></pre><button id="submit" disabled>지갑에서 승인·서명</button></section>
    <section><h2>거래 상태</h2><p id="status" class="feedback" role="status">지갑을 준비하고 있습니다.</p>
      <button id="recover" class="secondary" disabled>미확인 거래 상태 조회</button><a id="pending-link" hidden>해당 작업 열기 →</a>
    </section>
  </main>
</body>
</html>
