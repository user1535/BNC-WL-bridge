name: Local bridge gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.12'
          cache-dependency-path: proof-generator/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - name: Current receipt, wallet and contract gates
        run: python3 scripts/check-local-gates.py --skip-sdk
